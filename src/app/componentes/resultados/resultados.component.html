<div class="resultados-container">
  <div>
    <label for="juegoFiltro">Filtrar por juego:</label>
    <select id="juegoFiltro" [(ngModel)]="juegoSeleccionado" (change)="filtrarResultados()">
      <option value="todos">Todos</option>
      <option value="Ahorcado">Ahorcado</option>
      <option value="Mayor-Menor">Mayor-Menor</option>
      <option value="Preguntados">Preguntados</option>
      <option value="Pasapalabra">Pasapalabra</option>
    </select>
  </div>
  <table class="resultados-table table table-striped">
    <thead>
      <tr>
        <th>Juego</th>
        <th>Usuario</th>
        <th>Puntaje</th>
        <th>Fecha</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let resultado of resultadosFiltrados">
        <td>{{ resultado.juego }}</td>
        <td>{{ resultado.usuario }}</td>
        <td>{{ resultado.puntaje }}</td>
        <td>{{ resultado.fecha | date: 'dd/MM/yy hh:mm a' }}</td>
      </tr>
    </tbody>
  </table>
</div>
